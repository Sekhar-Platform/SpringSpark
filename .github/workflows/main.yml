name: SpringSpark - Build, Push and Deploy to ECS

on:
  push:
    branches:
      - develop
      - qa
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: springspark

  AWS_ACCOUNT_ID: "632404567481"

  DEV_ECS_CLUSTER: springspark-dev-cluster
  DEV_ECS_SERVICE: springspark-dev-service
  DEV_ECS_TASK_DEFINITION: springspark-dev-task

  QA_ECS_CLUSTER: springspark-qa-cluster
  QA_ECS_SERVICE: springspark-qa-service
  QA_ECS_TASK_DEFINITION: springspark-qa-task

  PROD_ECS_CLUSTER: springspark-prod-cluster
  PROD_ECS_SERVICE: springspark-prod-service
  PROD_ECS_TASK_DEFINITION: springspark-prod-task

  ECS_CONTAINER_NAME: springspark


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    # GitHub Environment
    # develop -> development
    # qa      -> qa
    # main    -> production
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qa' && 'qa' || 'development' }}

    concurrency:
      group: springspark-${{ github.ref_name }}
      cancel-in-progress: false

    steps:

      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Setup Java 21
      # ---------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # ---------------------------------------------------
      # 3. Build and test Spring Boot application
      # ---------------------------------------------------
      - name: Build Spring Boot application
        run: |
          mvn clean package


      # ---------------------------------------------------
      # 4. Configure AWS credentials using OIDC
      # ---------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::632404567481:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # 5. Verify AWS identity
      # ---------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------
      # 6. Determine environment
      # ---------------------------------------------------
      - name: Determine deployment environment
        id: environment
        shell: bash
        run: |

          if [ "${GITHUB_REF_NAME}" = "develop" ]; then

            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${DEV_ECS_CLUSTER}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${DEV_ECS_SERVICE}" >> $GITHUB_ENV
            echo "ECS_TASK_DEFINITION=${DEV_ECS_TASK_DEFINITION}" >> $GITHUB_ENV

          elif [ "${GITHUB_REF_NAME}" = "qa" ]; then

            echo "ENVIRONMENT=qa" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${QA_ECS_CLUSTER}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${QA_ECS_SERVICE}" >> $GITHUB_ENV
            echo "ECS_TASK_DEFINITION=${QA_ECS_TASK_DEFINITION}" >> $GITHUB_ENV

          elif [ "${GITHUB_REF_NAME}" = "main" ]; then

            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${PROD_ECS_CLUSTER}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${PROD_ECS_SERVICE}" >> $GITHUB_ENV
            echo "ECS_TASK_DEFINITION=${PROD_ECS_TASK_DEFINITION}" >> $GITHUB_ENV

          else

            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1

          fi

          echo "Deployment environment: ${GITHUB_REF_NAME}"


      # ---------------------------------------------------
      # 7. Login to Amazon ECR
      # ---------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # 8. Set image tag
      # ---------------------------------------------------
      - name: Set Docker image
        run: |

          IMAGE_TAG="${ENVIRONMENT}-${GITHUB_SHA}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> $GITHUB_ENV

          echo "Docker image:"
          echo "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"


      # ---------------------------------------------------
      # 9. Build Docker image
      # ---------------------------------------------------
      - name: Build Docker image
        run: |

          docker build \
            -t "${IMAGE_URI}" \
            .


      # ---------------------------------------------------
      # 10. Push Docker image to ECR
      # ---------------------------------------------------
      - name: Push Docker image to ECR
        run: |

          docker push "${IMAGE_URI}"


      # ---------------------------------------------------
      # 11. Display image
      # ---------------------------------------------------
      - name: Display ECR image
        run: |

          echo "======================================"
          echo "Docker image pushed successfully"
          echo "======================================"

          echo "Environment : ${ENVIRONMENT}"
          echo "Branch      : ${GITHUB_REF_NAME}"
          echo "Commit SHA  : ${GITHUB_SHA}"
          echo "Image       : ${IMAGE_URI}"


      # ---------------------------------------------------
      # 12. Get current ECS task definition
      # ---------------------------------------------------
      - name: Get current ECS task definition
        run: |

          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition \
            --output json > task-definition.json


      # ---------------------------------------------------
      # 13. Render new ECS task definition
      # ---------------------------------------------------
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}


      # ---------------------------------------------------
      # 14. Deploy to ECS
      # ---------------------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ---------------------------------------------------
      # 15. Deployment complete
      # ---------------------------------------------------
      - name: Deployment complete
        run: |

          echo "======================================"
          echo "SpringSpark deployment successful!"
          echo "======================================"

          echo "Environment : ${ENVIRONMENT}"
          echo "Branch      : ${GITHUB_REF_NAME}"
          echo "Cluster     : ${ECS_CLUSTER}"
          echo "Service     : ${ECS_SERVICE}"
          echo "Task Def    : ${ECS_TASK_DEFINITION}"
          echo "Image       : ${IMAGE_URI}"

          echo "======================================"
