name: SpringSpark - Build, Push and Deploy to ECS

on:
  push:
    branches:
      - develop
      - qa
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "632404567481"
  ECR_REPOSITORY: springspark

  ECS_CONTAINER_NAME: springspark

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qa' && 'qa' || 'development' }}

    concurrency:
      group: springspark-${{ github.ref_name }}
      cancel-in-progress: false

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Java
      # ==================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # ==================================================
      # 3. Build Spring Boot application
      # ==================================================

      - name: Build Spring Boot application
        run: |
          mvn clean package


      # ==================================================
      # 4. Determine environment
      # ==================================================

      - name: Determine deployment environment
        shell: bash
        run: |

          case "${GITHUB_REF_NAME}" in

            develop)

              echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"

              echo "ECS_CLUSTER=springspark-dev-cluster" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=springspark-dev-service" >> "$GITHUB_ENV"

              echo "ECS_TASK_DEFINITION=springspark-dev-task" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION_FILE=ecs/dev-task-definition.json" >> "$GITHUB_ENV"

              ;;


            qa)

              echo "ENVIRONMENT=qa" >> "$GITHUB_ENV"

              echo "ECS_CLUSTER=springspark-qa-cluster" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=springspark-qa-service" >> "$GITHUB_ENV"

              echo "ECS_TASK_DEFINITION=springspark-qa-task" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION_FILE=ecs/qa-task-definition.json" >> "$GITHUB_ENV"

              ;;


            main)

              echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"

              echo "ECS_CLUSTER=springspark-prod-cluster" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=springspark-prod-service" >> "$GITHUB_ENV"

              echo "ECS_TASK_DEFINITION=springspark-prod-task" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION_FILE=ecs/prod-task-definition.json" >> "$GITHUB_ENV"

              ;;


            *)

              echo "Unsupported branch: ${GITHUB_REF_NAME}"

              exit 1

              ;;

          esac


          echo "========================================"

          echo "Branch              : ${GITHUB_REF_NAME}"

          echo "Environment         : ${ENVIRONMENT}"

          echo "ECS Cluster         : ${ECS_CLUSTER}"

          echo "ECS Service         : ${ECS_SERVICE}"

          echo "Task Definition     : ${ECS_TASK_DEFINITION}"

          echo "Task Definition JSON: ${TASK_DEFINITION_FILE}"

          echo "========================================"


      # ==================================================
      # 5. Configure AWS
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::632404567481:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 6. Verify AWS identity
      # ==================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ==================================================
      # 7. Login to ECR
      # ==================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 8. Create image URI
      # ==================================================

      - name: Set Docker image
        run: |

          IMAGE_TAG="${GITHUB_SHA}"

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "========================================"

          echo "Docker Image: ${IMAGE_URI}"

          echo "========================================"


      # ==================================================
      # 9. Build Docker image
      # ==================================================

      - name: Build Docker image
        run: |

          docker build \
            -t "${IMAGE_URI}" \
            .


      # ==================================================
      # 10. Push image to ECR
      # ==================================================

      - name: Push Docker image to ECR
        run: |

          docker push "${IMAGE_URI}"


      # ==================================================
      # 11. Verify task definition JSON
      # ==================================================

      - name: Verify task definition
        run: |

          echo "Using: ${TASK_DEFINITION_FILE}"

          test -f "${TASK_DEFINITION_FILE}"

          cat "${TASK_DEFINITION_FILE}"


      # ==================================================
      # 12. Render task definition with new image
      # ==================================================

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}


      # ==================================================
      # 13. Deploy to ECS
      # ==================================================

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ==================================================
      # 14. Deployment complete
      # ==================================================

      - name: Deployment complete
        run: |

          echo "========================================"

          echo "SpringSpark deployment successful"

          echo "========================================"

          echo "AWS Account : ${AWS_ACCOUNT_ID}"

          echo "AWS Region  : ${AWS_REGION}"

          echo "Branch      : ${GITHUB_REF_NAME}"

          echo "Environment : ${ENVIRONMENT}"

          echo "Image       : ${IMAGE_URI}"

          echo "Cluster     : ${ECS_CLUSTER}"

          echo "Service     : ${ECS_SERVICE}"

          echo "Task Def    : ${ECS_TASK_DEFINITION}"

          echo "========================================"
