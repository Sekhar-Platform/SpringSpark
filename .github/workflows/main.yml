
name: SpringSpark - Build, Push and Deploy to ECS

on:
  push:
    branches:
      - develop

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    # ============================================================
    # GITHUB ENVIRONMENT
    # ============================================================
    environment:
      name: development

    concurrency:
      group: springspark-develop
      cancel-in-progress: false

    # ============================================================
    # ENVIRONMENT VARIABLES
    # ============================================================
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      TASK_DEFINITION_FILE: ${{ vars.TASK_DEFINITION_FILE }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. DEBUG GITHUB CONTEXT
      # ============================================================
      - name: Debug GitHub context
        shell: bash
        run: |

          echo "========================================"
          echo "GitHub Context"
          echo "========================================"

          echo "Repository  : ${GITHUB_REPOSITORY}"
          echo "Branch      : ${GITHUB_REF_NAME}"
          echo "Ref         : ${GITHUB_REF}"
          echo "Environment : development"

          echo "========================================"


      # ============================================================
      # 3. DISPLAY DEVELOPMENT CONFIGURATION
      # ============================================================
      - name: Display deployment configuration
        shell: bash
        run: |

          echo "========================================"
          echo "Development Deployment Configuration"
          echo "========================================"

          echo "AWS Account          : ${AWS_ACCOUNT_ID}"
          echo "AWS Region           : ${AWS_REGION}"
          echo "ECR Repository       : ${ECR_REPOSITORY}"
          echo "ECS Container        : ${ECS_CONTAINER_NAME}"
          echo "ECS Cluster          : ${ECS_CLUSTER}"
          echo "ECS Service          : ${ECS_SERVICE}"
          echo "ECS Task Definition  : ${ECS_TASK_DEFINITION}"
          echo "Task Definition File : ${TASK_DEFINITION_FILE}"

          echo "========================================"


      # ============================================================
      # 4. SETUP JAVA
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # ============================================================
      # 5. BUILD SPRING BOOT APPLICATION
      # ============================================================
      - name: Build Spring Boot application
        run: |
          mvn clean package -DskipTests


      # ============================================================
      # 6. CONFIGURE AWS USING GITHUB OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ vars.AWS_REGION }}


      # ============================================================
      # 7. VERIFY AWS ROLE
      # ============================================================
      - name: Verify AWS identity
        run: |

          echo "========================================"
          echo "AWS Identity"
          echo "========================================"

          aws sts get-caller-identity

          echo "========================================"


      # ============================================================
      # 8. LOGIN TO ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 9. CREATE DOCKER IMAGE URI
      # ============================================================
      #
      # Image tag format:
      #
      # <container>-<environment>-<git-sha>
      #
      # Example:
      #
      # springspark-development-e625138cc4aa9fc42b1da98a2c251cfb02619cc0
      #
      # ============================================================
      - name: Set Docker image
        shell: bash
        run: |

          CONTAINER_NAME="springspark"
          ENVIRONMENT_NAME="development"

          IMAGE_TAG="${CONTAINER_NAME}-${ENVIRONMENT_NAME}-${GITHUB_SHA}"

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "CONTAINER_NAME=${CONTAINER_NAME}" >> "$GITHUB_ENV"
          echo "ENVIRONMENT_NAME=${ENVIRONMENT_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Docker Image"
          echo "========================================"

          echo "Container  : ${CONTAINER_NAME}"
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Git SHA    : ${GITHUB_SHA}"
          echo "Image Tag  : ${IMAGE_TAG}"
          echo "Image URI  : ${IMAGE_URI}"

          echo "========================================"


      # ============================================================
      # 10. BUILD DOCKER IMAGE
      # ============================================================
      - name: Build Docker image
        run: |

          echo "Building Docker image..."

          docker build \
            -t "${IMAGE_URI}" \
            .

          echo "Docker image built successfully."


      # ============================================================
      # 11. PUSH IMAGE TO ECR
      # ============================================================
      - name: Push Docker image to ECR
        run: |

          echo "Pushing image to ECR..."

          docker push "${IMAGE_URI}"

          echo "========================================"
          echo "Image pushed successfully"
          echo "========================================"

          echo "${IMAGE_URI}"


      # ============================================================
      # 12. VERIFY ECS TASK DEFINITION
      # ============================================================
      - name: Verify ECS task definition
        run: |

          echo "========================================"
          echo "ECS Task Definition"
          echo "========================================"

          echo "File:"
          echo "${TASK_DEFINITION_FILE}"

          if [ ! -f "${TASK_DEFINITION_FILE}" ]; then

            echo "ERROR: Task definition file not found:"
            echo "${TASK_DEFINITION_FILE}"

            exit 1

          fi

          echo ""
          echo "Task definition contents:"
          echo ""

          cat "${TASK_DEFINITION_FILE}"

          echo ""
          echo "========================================"


      # ============================================================
      # 13. RENDER ECS TASK DEFINITION
      # ============================================================
      #
      # Replaces:
      #
      # image: PLACEHOLDER
      #
      # with:
      #
      # <AWS_ACCOUNT_ID>.dkr.ecr.<region>.amazonaws.com/springspark:
      # springspark-development-<GITHUB_SHA>
      #
      # ============================================================
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}


      # ============================================================
      # 14. DEPLOY TO ECS
      # ============================================================
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ============================================================
      # 15. DEPLOYMENT SUMMARY
      # ============================================================
      - name: Deployment complete
        run: |

          echo ""
          echo "========================================"
          echo "SPRINGSPARK DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo "AWS Account : ${AWS_ACCOUNT_ID}"
          echo "AWS Region  : ${AWS_REGION}"
          echo "Branch      : ${GITHUB_REF_NAME}"
          echo "Environment : ${ENVIRONMENT_NAME}"

          echo "Container   : ${CONTAINER_NAME}"
          echo "Image Tag   : ${IMAGE_TAG}"
          echo "Image       : ${IMAGE_URI}"

          echo "ECR Repo    : ${ECR_REPOSITORY}"

          echo "ECS Cluster : ${ECS_CLUSTER}"
          echo "ECS Service : ${ECS_SERVICE}"

          echo "Task Def    : ${ECS_TASK_DEFINITION}"
          echo "Task JSON   : ${TASK_DEFINITION_FILE}"

          echo "========================================"
